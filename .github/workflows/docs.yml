name: Docs

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install insurance-gam and pdoc
        run: |
          pip install -e ".[all]" pdoc

      - name: Generate API docs
        run: |
          pdoc \
            --output-directory docs/api \
            --docformat google \
            --footer-text "insurance-gam v$(python -c 'import insurance_gam; print(insurance_gam.__version__)')" \
            --edit-url "insurance_gam=https://github.com/burning-cost/insurance-gam/blob/main/src/insurance_gam/" \
            insurance_gam \
            insurance_gam.ebm \
            insurance_gam.anam \
            insurance_gam.pin

      - name: Commit updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "docs: regenerate API reference [skip ci]"
          git push
