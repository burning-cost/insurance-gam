name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install package with neural deps
        run: uv pip install --system -e ".[neural,dev]"

      - name: Run EBM tests (no interpretML required — mocked)
        run: uv run --no-project python -m pytest tests/ebm/ -v --tb=short

      - name: Run ANAM tests
        run: uv run --no-project python -m pytest tests/anam/ -v --tb=short

      - name: Run PIN tests
        run: uv run --no-project python -m pytest tests/pin/ -v --tb=short
